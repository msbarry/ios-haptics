<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<button onclick="tick()">vibrate</button>
<button onclick="tick2()">vibrate2</button>
<input id="visiblecheckbox" type="checkbox" switch/>
<script>
const input = document.createElement('input');
input.type = 'checkbox';
input.setAttribute('switch', '');
input.id = 'haptic-switch';
input.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';

const label = document.createElement('label');
label.htmlFor = 'haptic-switch';
label.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';

document.body.append(input, label);

function tick() {
  label.click();
  if (navigator.vibrate) navigator.vibrate(10);   // Android
}
function tick2() {
  visiblecheckbox.click();
}
</script>
